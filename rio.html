<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>rangi.dev</title>
  <style>
    body { margin: 0; font-family: "Times New Roman", Times, serif; background: #ffffee; }
    .container { display: flex; min-height: 100vh; }
    aside { width: 220px; padding: 16px; border-right: 1px solid #000; background: #eeffee; }
    aside ul { list-style: none; padding: 0; margin: 0; }
    aside a { text-decoration: none; color: black; }
    main { flex: 1; padding: 24px; }
    h1::after{ display: block; content: ''; margin-top: 10px; border-bottom: 1px solid #000; }
    h2::after{ display: block; content: ''; margin-top: 3px; border-bottom: 1px solid #aaa; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px 12px; text-align: left; }
    th { background: #eee; }
    code { background-color: #f3f3f3; padding: 2px; }
    #drop { border: 1px dashed #000; padding: 24px; text-align: center; max-width: 400px; }
    #drop.over { background: #eee; }
    #result { margin-top: 16px; word-break: break-all; }
    #preview { margin-top: 16px; max-width: 400px; border: 1px solid #ccc; background: #fff; padding: 8px; }
    #preview img { display: block; max-width: 100%; margin-bottom: 8px; }
    #preview p { margin: 4px 0; }
  </style>
</head>
<body>
  <div class="container">
    <aside>
      <a href="http://rangi.dev/" target="_blank">home</a>
      <h2>Contents</h2>
      <ul>
        <li>
          <a href="#1">Recipe roller</a>
          <ul>
            <li>├─<a href="#1.1">Upload</a></li>
            <li>└─<a href="#1.2">Roll</a></li>
          </ul>
        </li>
      </ul>
    </aside>
    <main>

<h1 id="1">Recipe roller</h1>

<h2 id="1.1">Upload</h2>

<div id="drop">
  <p>Drop a .csv or .txt file here</p>
  <p>or</p>
  <button type="button" id="pick">Choose file</button>
  <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" hidden>
  <p id="status">No file loaded.</p>
</div>

<h2 id="1.2">Roll</h2>

<button type="button" id="roll">Roll</button>
<div id="result"></div>
<div id="previewbox"></div>

    </main>
  </div>

  <script>
    var STEP = 12; // ascii codes advanced per frame; lower = slower animation

    var recipes = [];
    var rollId = 0;
    var drop = document.getElementById("drop");
    var fileInput = document.getElementById("file");
    var statusEl = document.getElementById("status");
    var result = document.getElementById("result");
    var previewBox = document.getElementById("previewbox");

    document.getElementById("pick").onclick = function () { fileInput.click(); };
    fileInput.onchange = function () { if (fileInput.files[0]) load(fileInput.files[0]); };

    drop.ondragover = function (e) { e.preventDefault(); drop.className = "over"; };
    drop.ondragleave = function () { drop.className = ""; };
    drop.ondrop = function (e) {
      e.preventDefault();
      drop.className = "";
      if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
    };

    // Stop the browser from opening a file dropped outside the box
    window.ondragover = function (e) { e.preventDefault(); };
    window.ondrop = function (e) { e.preventDefault(); };

    function load(file) {
      var reader = new FileReader();
      reader.onload = function () {
        recipes = reader.result.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
        statusEl.textContent = recipes.length + " items loaded";
        rollId++;
        result.textContent = "";
        previewBox.textContent = "";
      };
      reader.readAsText(file);
    }

    // Final text: plain, with the URL turned into a link
    function renderFinal(line, url) {
      result.textContent = "";
      if (!url) { result.textContent = line; return; }
      var a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.textContent = url;
      var i = line.indexOf(url);
      result.appendChild(document.createTextNode(line.slice(0, i)));
      result.appendChild(a);
      result.appendChild(document.createTextNode(line.slice(i + url.length)));
    }

    // Link preview via microlink.io (a page can't read other sites directly)
    function fetchPreview(url) {
      return fetch("https://api.microlink.io/?url=" + encodeURIComponent(url))
        .then(function (r) { return r.json(); })
        .then(function (j) { return j.status === "success" ? j.data : null; })
        .catch(function () { return null; });
    }

    function showPreview(url, data) {
      previewBox.textContent = "";
      if (!data) return;
      var box = document.createElement("div");
      box.id = "preview";
      if (data.image && data.image.url) {
        var img = document.createElement("img");
        img.src = data.image.url;
        img.alt = "";
        box.appendChild(img);
      }
      if (data.title) {
        var p = document.createElement("p");
        var a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.textContent = data.title;
        p.appendChild(a);
        box.appendChild(p);
      }
      if (data.description) {
        var d = document.createElement("p");
        d.textContent = data.description;
        box.appendChild(d);
      }
      if (data.publisher) {
        var s = document.createElement("p");
        s.textContent = data.publisher;
        box.appendChild(s);
      }
      previewBox.appendChild(box);
    }

    document.getElementById("roll").onclick = function () {
      var id = ++rollId; // starting a new roll cancels any running animation
      result.textContent = "";
      previewBox.textContent = "";
      if (!recipes.length) { result.textContent = "Load a file first."; return; }

      var line = recipes[Math.floor(Math.random() * recipes.length)];
      var m = line.match(/https?:\/\/[^\s,;"']+/);
      var url = m ? m[0] : null;
      var preview = url ? fetchPreview(url) : null; // loads while the text animates

      var chars = Array.from(line);
      var done = "";
      var i = 0;
      var code = 33; // start each character at "!"

      function finish() {
        renderFinal(line, url);
        if (preview) preview.then(function (data) {
          if (id === rollId) showPreview(url, data);
        });
      }

      function tick() {
        if (id !== rollId) return;
        var target = chars[i].codePointAt(0);
        var limit = Math.min(target, 126);
        if (code >= limit) {
          // reached the right character (or it is a space, "!" or non-ASCII): lock it in
          done += chars[i];
          i++;
          code = 33;
          if (i >= chars.length) { finish(); return; }
        } else {
          code = Math.min(code + STEP, limit);
        }
        result.textContent = done + String.fromCharCode(code);
        requestAnimationFrame(tick);
      }

      result.textContent = "!";
      requestAnimationFrame(tick);
    };
  </script>
</body>
</html>
