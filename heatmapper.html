<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heatmapper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS (pinned) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    #map.dragover {
      outline: 3px dashed #0077ff;
      outline-offset: -3px;
    }
    #controls {
      position: absolute;
      top: 10px; left: 50px;
      background: rgba(255,255,255,0.95);
      padding: 10px; border-radius: 6px;
      z-index: 1000;
      max-width: 240px;
      display: none;
    }
    #controls label { font-size: 0.9em; display: block; margin-top: 6px; }
    #controls input[type=range] { width: 100%; }
    #controls button, #controls input[type=file] { margin-top: 6px; width: 100%; }
    #analysis {
      display: none; position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 50vh; overflow: auto; box-sizing: border-box;
      background: rgba(255,255,255,0.97); z-index: 1100;
      padding: 10px 14px; box-shadow: 0 -2px 8px rgba(0,0,0,0.25); font-size: 0.9em;
    }
    .an-head, .an-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .an-head #anClose { margin-left: auto; }
    .an-block { margin-top: 10px; }
    .an-scroll { overflow-x: auto; }
    #analysis button { cursor: pointer; }
    #analysis button:disabled { cursor: default; }
    #tip {
      display: none; position: fixed; z-index: 1300; pointer-events: none;
      background: rgba(30,30,30,0.92); color: #fff; padding: 5px 8px;
      border-radius: 4px; font-size: 12px; line-height: 1.4; white-space: nowrap;
    }
    #dayPanel {
      display: none; position: fixed; top: 0; right: 0; width: 210px;
      overflow-y: auto; box-sizing: border-box; z-index: 1150;
      background: rgba(255,255,255,0.97); padding: 10px;
      box-shadow: -2px 0 8px rgba(0,0,0,0.25); font-size: 0.9em;
    }
    #dayPanel button { cursor: pointer; }
    #yearLabel { font-weight: bold; min-width: 3em; text-align: center; }
  </style>
</head>
<body>
  <div id="controls">
    <input type="file" id="fileInput" accept=".gpx,.tcx" multiple />
    <button id="downloadBtn" disabled>Download combined.csv</button>

    <label>Radius: <span id="radiusVal">10</span></label>
    <input type="range" id="radiusSlider" min="1" max="30" step="1" value="10">
    <label>Blur: <span id="blurVal">10</span></label>
    <input type="range" id="blurSlider" min="1" max="30" step="1" value="10">
  </div>
  <div id="map"></div>

  <div id="tip"></div>
  <div id="dayPanel"></div>

  <div id="analysis">
    <div class="an-head">
      <strong>Area analysis</strong><span id="anSummary"></span>
      <button id="anClose">✕</button>
    </div>
    <div class="an-block">
      <div class="an-row">
        <button id="prevYear">◀</button><span id="yearLabel"></span><button id="nextYear">▶</button>
        <span id="yearInfo"></span>
        <button id="dlCal">Download CSV</button>
      </div>
      <div class="an-scroll" id="calendar"></div>
    </div>
    <div class="an-block">
      <div class="an-row">
        <strong>Time of day</strong><span id="dayNight"></span>
        <button id="dlHours">Download CSV</button>
      </div>
      <div class="an-scroll" id="hours"></div>
    </div>
  </div>

  <!-- Libraries (pinned versions) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    const map = L.map('map').setView([0, 0], 2);

    let heatLayer;
    let combinedData = [];

    const settings = {
      radius: 10,
      blur: 10,
      maxZoom: 28,
      max: 2.0,
      minOpacity: 0.4
    };

    // --- Tile layers (no API key needed) ---
    const lightLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const darkLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri'
    });

    // --- Helper to build a square toggle button control ---
    function makeButtonControl(html, onClick) {
      const Ctrl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function () {
          const c = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
          c.style.backgroundColor = 'white';
          c.style.width = '30px';
          c.style.height = '30px';
          c.style.cursor = 'pointer';
          c.style.display = 'flex';
          c.style.alignItems = 'center';
          c.style.justifyContent = 'center';
          c.innerHTML = html;
          c.onclick = () => onClick(c);
          L.DomEvent.disableClickPropagation(c);
          return c;
        }
      });
      map.addControl(new Ctrl());
    }

    // Settings toggle
    makeButtonControl('⚙', () => {
      const ctrl = document.getElementById('controls');
      ctrl.style.display = ctrl.style.display === 'none' || !ctrl.style.display ? 'block' : 'none';
    });

    // Dark/light toggle
    let dark = false;
    makeButtonControl('🌙', (btn) => {
      if (dark) {
        map.removeLayer(darkLayer);
        map.addLayer(lightLayer);
        btn.innerHTML = '🌙';
      } else {
        map.removeLayer(lightLayer);
        map.addLayer(darkLayer);
        btn.innerHTML = '☀';
      }
      dark = !dark;
    });

    // --- Slider init ---
    const radiusSlider = document.getElementById('radiusSlider');
    const blurSlider = document.getElementById('blurSlider');
    document.getElementById('radiusVal').textContent = radiusSlider.value;
    document.getElementById('blurVal').textContent = blurSlider.value;
    settings.radius = parseInt(radiusSlider.value);
    settings.blur = parseInt(blurSlider.value);

    radiusSlider.addEventListener('input', (e) => {
      settings.radius = parseInt(e.target.value);
      document.getElementById('radiusVal').textContent = settings.radius;
      if (combinedData.length) updateMap();
    });

    blurSlider.addEventListener('input', (e) => {
      settings.blur = parseInt(e.target.value);
      document.getElementById('blurVal').textContent = settings.blur;
      if (combinedData.length) updateMap();
    });

    // --- Parsers ---
    function parseGpx(text) {
      const xml = new DOMParser().parseFromString(text, "application/xml");
      const points = [];
      xml.querySelectorAll("trkpt").forEach(pt => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        const tEl = pt.querySelector("time");
        const t = tEl ? Date.parse(tEl.textContent) : NaN;
        if (!isNaN(lat) && !isNaN(lon)) points.push({ lat, lon, t: isNaN(t) ? null : t });
      });
      return points;
    }

    function parseTcx(text) {
      const xml = new DOMParser().parseFromString(text, "application/xml");
      const points = [];
      xml.querySelectorAll("Trackpoint").forEach(tp => {
        const latEl = tp.querySelector("LatitudeDegrees");
        const lonEl = tp.querySelector("LongitudeDegrees");
        if (latEl && lonEl) {
          const lat = parseFloat(latEl.textContent);
          const lon = parseFloat(lonEl.textContent);
          const tEl = tp.querySelector("Time");
          const t = tEl ? Date.parse(tEl.textContent) : NaN;
          if (!isNaN(lat) && !isNaN(lon)) points.push({ lat, lon, t: isNaN(t) ? null : t });
        }
      });
      return points;
    }

    // --- Single file handler used by both the file picker and drag & drop ---
    function handleFiles(files) {
      if (!files.length) return;

      combinedData = [];
      let loaded = 0;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const name = file.name.toLowerCase();
          let points = [];
          if (name.endsWith(".gpx")) points = parseGpx(evt.target.result);
          else if (name.endsWith(".tcx")) points = parseTcx(evt.target.result);
          for (const p of points) combinedData.push(p);
          loaded++;
          if (loaded === files.length) {
            updateMap();
            document.getElementById('downloadBtn').disabled = false;
            if (selRect) runAnalysis();
          }
        };
        reader.readAsText(file);
      });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function updateMap() {
      if (!combinedData.length) {
        alert("No points found in the selected files.");
        return;
      }
      if (heatLayer) map.removeLayer(heatLayer);
      const latlngs = combinedData.map(p => [p.lat, p.lon]);
      heatLayer = L.heatLayer(latlngs, settings).addTo(map);
      map.fitBounds(L.latLngBounds(latlngs));
    }

    // --- CSV download ---
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!combinedData.length) return;
      let csv = "Latitude,Longitude,Time\n";
      csv += combinedData.map(p => `${p.lat},${p.lon},${p.t ? new Date(p.t).toISOString() : ""}`).join("\n");

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "combined.csv";
      a.click();
      URL.revokeObjectURL(url);
    });

    // --- Drag & drop ---
    const mapDiv = document.getElementById("map");

    ["dragenter", "dragover", "dragleave", "drop"].forEach(evt => {
      mapDiv.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);
    });

    mapDiv.addEventListener("dragenter", () => mapDiv.classList.add("dragover"));
    mapDiv.addEventListener("dragleave", () => mapDiv.classList.remove("dragover"));
    mapDiv.addEventListener("drop", (e) => {
      mapDiv.classList.remove("dragover");
      handleFiles(e.dataTransfer.files);
    });

    // =========================================================
    // --- Analyse: draw a rectangle, see calendar + hour charts ---
    // =========================================================
    let selRect = null, drawMode = false, drawing = false, drawStart = null, analyseBtn = null;
    let dayCounts = new Map(), hourCounts = new Array(24).fill(0);
    let dataDays = new Set();   // days with timestamped data anywhere on the map
    let analysisYears = [], analysisYear = null;

    const panel = document.getElementById('analysis');
    L.DomEvent.disableClickPropagation(panel);
    L.DomEvent.disableScrollPropagation(panel);

    const pad = n => String(n).padStart(2, '0');
    const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    function downloadCsv(filename, csv) {
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function setDrawMode(on) {
      drawMode = on;
      mapDiv.style.cursor = on ? 'crosshair' : '';
      if (analyseBtn) analyseBtn.style.backgroundColor = on ? '#cde4ff' : 'white';
    }

    makeButtonControl('▭', (btn) => {
      analyseBtn = btn;
      setDrawMode(!drawMode);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && drawMode) setDrawMode(false);
    });

    map.on('mousedown', (e) => {
      if (!drawMode) return;
      drawing = true;
      drawStart = e.latlng;
      map.dragging.disable();
      if (selRect) map.removeLayer(selRect);
      selRect = L.rectangle([drawStart, drawStart], { color: '#0077ff', weight: 2, fillOpacity: 0.1, interactive: false }).addTo(map);
    });

    map.on('mousemove', (e) => {
      if (drawing) selRect.setBounds([drawStart, e.latlng]);
    });

    map.on('mouseup', (e) => {
      if (!drawing) return;
      drawing = false;
      map.dragging.enable();
      setDrawMode(false);
      const a = map.latLngToContainerPoint(drawStart), b = map.latLngToContainerPoint(e.latlng);
      if (Math.abs(a.x - b.x) < 5 && Math.abs(a.y - b.y) < 5) {   // just a click, no real rectangle
        map.removeLayer(selRect); selRect = null; return;
      }
      selRect.setBounds([drawStart, e.latlng]);
      runAnalysis();
    });

    document.getElementById('anClose').addEventListener('click', () => {
      panel.style.display = 'none';
      if (selRect) { map.removeLayer(selRect); selRect = null; }
    });

    function runAnalysis() {
      if (!selRect) return;
      const b = selRect.getBounds();
      const inside = combinedData.filter(p => b.contains([p.lat, p.lon]));
      const years = new Set();
      dataDays = new Set();
      for (const p of combinedData) {
        if (p.t === null) continue;
        const d = new Date(p.t);
        dataDays.add(dayKey(d));
        years.add(d.getFullYear());
      }
      dayCounts = new Map();
      hourCounts = new Array(24).fill(0);
      let timed = 0;

      for (const p of inside) {
        if (p.t === null) continue;
        timed++;
        const d = new Date(p.t);
        const k = dayKey(d);
        dayCounts.set(k, (dayCounts.get(k) || 0) + 1);
        hourCounts[d.getHours()]++;
      }

      analysisYears = [...years].sort((a, b) => a - b);
      if (!analysisYears.includes(analysisYear)) {
        analysisYear = analysisYears.length ? analysisYears[analysisYears.length - 1] : new Date().getFullYear();
      }

      const untimed = inside.length - timed;
      document.getElementById('anSummary').textContent =
        `${inside.length} points in area (${timed} with timestamps` + (untimed ? `, ${untimed} without – ignored` : '') + ')';

      panel.style.display = 'block';
      selectedDay = null;
      document.getElementById('dayPanel').style.display = 'none';
      renderCalendar();
      renderHours();
    }

    // --- 1. Contribution-style calendar ---
    function renderCalendar() {
      const y = analysisYear;
      const minY = analysisYears[0], maxY = analysisYears[analysisYears.length - 1];
      document.getElementById('yearLabel').textContent = y;
      document.getElementById('prevYear').disabled = !analysisYears.length || y <= minY;
      document.getElementById('nextYear').disabled = !analysisYears.length || y >= maxY;

      const S = 12, G = 3, left = 30, top = 18, step = S + G;
      const isLeap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
      const nDays = isLeap ? 366 : 365;
      const offset = new Date(y, 0, 1).getDay();   // Sunday = row 0

      const days = [];
      let max = 0, visited = 0, total = 0;
      for (let i = 0; i < nDays; i++) {
        const d = new Date(y, 0, 1 + i);
        const c = dayCounts.get(dayKey(d)) || 0;
        days.push({ d, c });
        if (c > max) max = c;
        if (c) { visited++; total += c; }
      }

      let svg = '';
      const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      days.forEach(({ d, c }, i) => {
        const col = Math.floor((offset + i) / 7), row = (offset + i) % 7;
        const x = left + col * step, yy = top + row * step;
        if (d.getDate() === 1) svg += `<text x="${x}" y="12" font-size="10" fill="#555">${mNames[d.getMonth()]}</text>`;
        const fill = c ? '#0077ff' : '#ebedf0';
        const op = c ? (0.2 + 0.8 * Math.sqrt(c / max)).toFixed(2) : 1;
        svg += `<rect x="${x}" y="${yy}" width="${S}" height="${S}" rx="2" fill="${fill}" fill-opacity="${op}" data-day="${dayKey(d)}" style="cursor:pointer"${dayKey(d) === selectedDay ? ' stroke="#000" stroke-width="1.5"' : ''}></rect>`;
        if (!c && !dataDays.has(dayKey(d))) svg += `<line x1="${x + 2}" y1="${yy + S - 2}" x2="${x + S - 2}" y2="${yy + 2}" stroke="#b5b9bf" stroke-width="1" pointer-events="none"/>`;
      });
      [['Mon', 1], ['Wed', 3], ['Fri', 5]].forEach(([t, r]) => {
        svg += `<text x="0" y="${top + r * step + 10}" font-size="10" fill="#555">${t}</text>`;
      });

      const w = left + 54 * step, h = top + 7 * step;
      document.getElementById('calendar').innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${svg}</svg>`;
      document.getElementById('yearInfo').textContent = `${visited} days visited, ${total} points`;
    }

    document.getElementById('prevYear').addEventListener('click', () => { analysisYear--; renderCalendar(); });
    document.getElementById('nextYear').addEventListener('click', () => { analysisYear++; renderCalendar(); });

    document.getElementById('dlCal').addEventListener('click', () => {
      const y = analysisYear, isLeap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
      let csv = "Date,Points\n";
      for (let i = 0; i < (isLeap ? 366 : 365); i++) {
        const k = dayKey(new Date(y, 0, 1 + i));
        csv += `${k},${dayCounts.get(k) || 0}\n`;
      }
      downloadCsv(`area-calendar-${y}.csv`, csv);
    });

    // --- 2. Time-of-day distribution ---
    function renderHours() {
      const total = hourCounts.reduce((a, b) => a + b, 0);
      const max = Math.max(1, ...hourCounts);
      const BW = 22, left = 36, top = 10, H = 110;
      const isDay = h => h >= 6 && h < 18;

      let svg = '';
      for (let h = 0; h < 24; h++) {
        const bh = Math.round((hourCounts[h] / max) * H);
        const x = left + h * BW;
        svg += `<rect x="${x + 2}" y="${top + H - bh}" width="${BW - 4}" height="${bh}" rx="2" fill="${isDay(h) ? '#f5a623' : '#3b4a8c'}"><title>${pad(h)}:00–${pad(h)}:59: ${hourCounts[h]} points</title></rect>`;
        if (h % 3 === 0) svg += `<text x="${x + BW / 2}" y="${top + H + 14}" font-size="10" text-anchor="middle" fill="#555">${pad(h)}</text>`;
      }
      svg += `<line x1="${left}" y1="${top + H}" x2="${left + 24 * BW}" y2="${top + H}" stroke="#999"/>`;
      svg += `<text x="${left - 4}" y="${top + 8}" font-size="10" text-anchor="end" fill="#555">${max}</text>`;
      svg += `<text x="${left - 4}" y="${top + H}" font-size="10" text-anchor="end" fill="#555">0</text>`;

      const w = left + 24 * BW + 10, h = top + H + 20;
      document.getElementById('hours').innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${svg}</svg>`;

      const dayN = hourCounts.reduce((s, c, i) => s + (isDay(i) ? c : 0), 0);
      const el = document.getElementById('dayNight');
      if (!total) { el.textContent = 'No timestamped points in this area'; return; }
      const dp = Math.round(dayN / total * 100);
      el.textContent = `Day (06–18): ${dp}%  ·  Night (18–06): ${100 - dp}%  →  ${dp >= 60 ? 'mostly a day visit area' : dp <= 40 ? 'mostly a night visit area' : 'mixed day/night'}`;
    }

    document.getElementById('dlHours').addEventListener('click', () => {
      const total = hourCounts.reduce((a, b) => a + b, 0) || 1;
      let csv = "Hour,Points,Percent\n";
      hourCounts.forEach((c, h) => { csv += `${pad(h)}:00,${c},${(c / total * 100).toFixed(2)}\n`; });
      downloadCsv('area-time-of-day.csv', csv);
    });

    // =========================================================
    // --- Calendar hover tooltip + click for day timeline ---
    // =========================================================
    let selectedDay = null;
    const tip = document.getElementById('tip');
    const dayPanel = document.getElementById('dayPanel');
    const calEl = document.getElementById('calendar');

    const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const prettyDate = k => parseKey(k).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    const cellOf = e => e.target.closest ? e.target.closest('rect[data-day]') : null;
    const hhmm = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    calEl.addEventListener('mousemove', (e) => {
      const r = cellOf(e);
      if (!r) { tip.style.display = 'none'; return; }
      const k = r.dataset.day, c = dayCounts.get(k) || 0;
      const status = c ? `${c} point${c === 1 ? '' : 's'} in area`
                       : dataDays.has(k) ? 'Recorded elsewhere only' : 'No data';
      tip.innerHTML = `<strong>${prettyDate(k)}</strong><br>${status}`;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY - 46) + 'px';
    });
    calEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

    calEl.addEventListener('click', (e) => {
      const r = cellOf(e);
      if (!r) return;
      selectedDay = r.dataset.day;
      renderCalendar();
      renderDayTimeline();
    });

    document.getElementById('anClose').addEventListener('click', () => {
      selectedDay = null;
      dayPanel.style.display = 'none';
      tip.style.display = 'none';
    });

    function renderDayTimeline() {
      const k = selectedDay;
      if (!k || !selRect) return;
      const b = selRect.getBounds();
      const day = parseKey(k);
      const start = day.getTime();
      const end = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1).getTime();

      const inBins = new Array(1440).fill(0), outBins = new Array(1440).fill(0);
      let inN = 0, outN = 0, first = Infinity, last = -Infinity;
      for (const p of combinedData) {
        if (p.t === null || p.t < start || p.t >= end) continue;
        const d = new Date(p.t);
        const m = d.getHours() * 60 + d.getMinutes();
        if (b.contains([p.lat, p.lon])) {
          inBins[m]++; inN++;
          if (p.t < first) first = p.t;
          if (p.t > last) last = p.t;
        } else {
          outBins[m]++; outN++;
        }
      }

      const HR = 30, H = 24 * HR, top = 28, left = 40, LW = 70, GAP = 10;
      let svg = '';
      svg += `<text x="${left + LW / 2}" y="12" font-size="11" text-anchor="middle" fill="#0077ff">In area</text>`;
      svg += `<text x="${left + LW + GAP + LW / 2}" y="12" font-size="11" text-anchor="middle" fill="#888">Elsewhere</text>`;
      for (let h = 0; h <= 24; h++) {
        const y = top + h * HR;
        svg += `<line x1="${left - 4}" y1="${y}" x2="${left + 2 * LW + GAP}" y2="${y}" stroke="#e3e5e8"/>`;
        if (h < 24) svg += `<text x="${left - 8}" y="${y + 4}" font-size="10" text-anchor="end" fill="#555">${pad(h)}:00</text>`;
      }
      svg += `<rect x="${left}" y="${top}" width="${LW}" height="${H}" fill="#0077ff" fill-opacity="0.05"/>`;
      svg += `<rect x="${left + LW + GAP}" y="${top}" width="${LW}" height="${H}" fill="#888" fill-opacity="0.05"/>`;

      const drawBins = (bins, x, color) => {
        bins.forEach((n, m) => {
          if (!n) return;
          const y = top + (m / 1440) * H;
          svg += `<rect x="${x}" y="${y.toFixed(2)}" width="${LW}" height="${Math.max(1.5, H / 1440).toFixed(2)}" fill="${color}"><title>${pad(Math.floor(m / 60))}:${pad(m % 60)} – ${n} point${n === 1 ? '' : 's'}</title></rect>`;
        });
      };
      drawBins(inBins, left, '#0077ff');
      drawBins(outBins, left + LW + GAP, '#999');

      const w = left + 2 * LW + GAP + 8, h = top + H + 8;
      const summary = inN
        ? `${inN} point${inN === 1 ? '' : 's'} in area, ${hhmm(first)}–${hhmm(last)}`
        : 'Not visited';
      dayPanel.innerHTML =
        `<div class="an-head"><strong>${prettyDate(k)}</strong><button id="dayClose" style="margin-left:auto">✕</button></div>` +
        `<div style="margin-bottom:6px">${summary}${outN ? `<br>${outN} point${outN === 1 ? '' : 's'} elsewhere` : ''}${!inN && !outN ? '<br>No data this day' : ''}</div>` +
        `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${svg}</svg>`;

      dayPanel.style.bottom = panel.offsetHeight + 'px';
      dayPanel.style.display = 'block';
      document.getElementById('dayClose').onclick = () => {
        selectedDay = null;
        dayPanel.style.display = 'none';
        renderCalendar();
      };
    }
  </script>
</body>
</html>
